<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eva Sánchez - Exact Effect</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #ebebeb;
            color: #000;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            cursor: crosshair;
        }

        .info {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(0, 0, 0, 0.3);
            font-size: 10px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="info">Hover to distort</div>

    <script>
        const canvas = document.getElementById('canvas');
        const gl = canvas.getContext('webgl', { 
            alpha: true, 
            premultipliedAlpha: false,
            antialias: true
        });

        if (!gl) {
            alert('WebGL not supported');
        }

        // Setup canvas
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = 1400 * dpr;
        canvas.height = 500 * dpr;
        canvas.style.width = '1400px';
        canvas.style.height = '500px';
        gl.viewport(0, 0, canvas.width, canvas.height);

        // Create text texture
        const textCanvas = document.createElement('canvas');
        const ctx = textCanvas.getContext('2d');
        textCanvas.width = 1400 * dpr;
        textCanvas.height = 500 * dpr;

        ctx.fillStyle = '#000000';
        ctx.font = `900 ${160 * dpr}px -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Eva Sánchez', textCanvas.width / 2, textCanvas.height / 2);

        const texture = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, textCanvas);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

        // Shaders
        const vertexShaderSource = `
            attribute vec2 position;
            attribute vec2 uv;
            varying vec2 vUv;
            
            void main() {
                vUv = uv;
                gl_Position = vec4(position, 0.0, 1.0);
            }
        `;

        const fragmentShaderSource = `
            precision highp float;
            
            uniform sampler2D uTexture;
            uniform vec2 uMouse;
            uniform float uTime;
            uniform float uHoverAmount;
            
            varying vec2 vUv;
            
            void main() {
                vec2 uv = vUv;
                
                // Calculate distance from mouse
                float dist = distance(vUv, uMouse);
                float influence = smoothstep(0.5, 0.0, dist) * uHoverAmount;
                
                if (influence > 0.01) {
                    // VERY HIGH frequency = VERY THIN vertical lines
                    float pattern = sin(vUv.x * 120.0 + uTime * 1.2);
                    
                    // VERY SMALL displacement = SUBTLE effect
                    float displacement = pattern * influence * 0.02;
                    
                    // Apply ONLY to X coordinate (horizontal shift)
                    uv.x += displacement;
                    
                    // NO wrapping - clamp to edges
                    uv.x = clamp(uv.x, 0.0, 1.0);
                }
                
                // Sample texture ONCE - NO alpha manipulation
                vec4 color = texture2D(uTexture, uv);
                
                gl_FragColor = color;
            }
        `;

        // Compile shaders
        function compileShader(source, type) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error('Shader error:', gl.getShaderInfoLog(shader));
                return null;
            }
            return shader;
        }

        const vertexShader = compileShader(vertexShaderSource, gl.VERTEX_SHADER);
        const fragmentShader = compileShader(fragmentShaderSource, gl.FRAGMENT_SHADER);

        const program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);

        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            console.error('Program error:', gl.getProgramInfoLog(program));
        }

        gl.useProgram(program);

        // Setup geometry
        const positions = new Float32Array([
            -1, -1,  1, -1,  -1, 1,  1, 1
        ]);

        const uvs = new Float32Array([
            0, 1,  1, 1,  0, 0,  1, 0
        ]);

        const positionBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

        const positionLocation = gl.getAttribLocation(program, 'position');
        gl.enableVertexAttribArray(positionLocation);
        gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

        const uvBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, uvBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, uvs, gl.STATIC_DRAW);

        const uvLocation = gl.getAttribLocation(program, 'uv');
        gl.enableVertexAttribArray(uvLocation);
        gl.vertexAttribPointer(uvLocation, 2, gl.FLOAT, false, 0, 0);

        // Uniforms
        const uTexture = gl.getUniformLocation(program, 'uTexture');
        const uMouse = gl.getUniformLocation(program, 'uMouse');
        const uTime = gl.getUniformLocation(program, 'uTime');
        const uHoverAmount = gl.getUniformLocation(program, 'uHoverAmount');

        // Mouse tracking
        let mouse = { x: 0.5, y: 0.5 };
        let targetMouse = { x: 0.5, y: 0.5 };
        let hoverAmount = 0.0;
        let targetHoverAmount = 0.0;

        canvas.addEventListener('mouseenter', () => {
            targetHoverAmount = 1.0;
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            targetMouse.x = (e.clientX - rect.left) / rect.width;
            targetMouse.y = 1.0 - (e.clientY - rect.top) / rect.height;
        });

        canvas.addEventListener('mouseleave', () => {
            targetHoverAmount = 0.0;
        });

        // Animation
        let time = 0;
        function animate() {
            time += 0.016;
            
            // Smooth interpolation
            mouse.x += (targetMouse.x - mouse.x) * 0.1;
            mouse.y += (targetMouse.y - mouse.y) * 0.1;
            hoverAmount += (targetHoverAmount - hoverAmount) * 0.12;

            // Clear
            gl.clearColor(0.92, 0.92, 0.92, 1.0);
            gl.clear(gl.COLOR_BUFFER_BIT);

            // Enable blending
            gl.enable(gl.BLEND);
            gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

            // Set uniforms
            gl.uniform1i(uTexture, 0);
            gl.uniform2f(uMouse, mouse.x, mouse.y);
            gl.uniform1f(uTime, time);
            gl.uniform1f(uHoverAmount, hoverAmount);

            // Draw
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
